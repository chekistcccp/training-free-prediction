seed: 20260901
project_name: CausalCRC-AD

model:
  id: Qwen/Qwen3.5-9B
  local_dir: models/Qwen3.5-9B
  dtype: bfloat16
  device: cuda
  attn_implementation: sdpa
  max_new_tokens: 192
  enable_thinking: false
  image_size: 512

paths:
  msd_root: data/MSD_Task10_Colon
  stageii_root: data/StageII-Colorectal-CT
  processed_root: data/processed
  output_root: outputs

ct:
  window_level: 40
  window_width: 400
  canonicalize_nifti: true

slice_screening:
  stride: 1
  top_k: [1, 3, 5]
  use_neighbor_context: false

localization:
  coarse_grid: 4
  proposal_top_k: 3
  refine_grid: 3
  refine_top_k: 1
  perturbations: [blur, mean_fill, inpaint]
  blur_radius: 12
  inpaint_radius: 5
  control_count: 3
  final_top_percentile: 15

experiments:
  run_msd_slice_screening: true
  run_msd_oracle_localization: true
  run_msd_end_to_end_localization: true
  run_exhaustive_occlusion_baseline: true
  run_stageii_external: true

runtime:
  resume: true
  save_counterfactuals: false
  empty_cache_every: 16
  max_cases: null
  stageii_max_cases: null
